<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReplyForge AI Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="settings-shell">
      <section class="settings-card">
        <div class="settings-header">
          <div class="brand-icon">R</div>
          <div>
            <h1>ReplyForge AI Settings</h1>
            <p>Use the same ReplyForge account as the web app.</p>
          </div>
        </div>

        <div class="notice">
          Provider API keys are never required or stored in the extension.
        </div>

        <section>
          <div class="button-row">
            <button id="signInButton" type="button" class="primary-button">
              Sign in with Google
            </button>
            <button id="signOutButton" type="button" class="secondary-button">
              Sign out
            </button>
          </div>

          <div id="statusMessage" class="status-message" hidden></div>
        </section>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
