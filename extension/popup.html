<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messaura AI</title>
    <link rel="stylesheet" href="ai-coach-ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand">
          <div class="brand-icon">M</div>
          <div>
            <h1>Messaura AI</h1>
            <p>Your AI communication workspace.</p>
          </div>
        </div>
        <span class="status-badge">Ready</span>
      </header>

      <section class="field-group">
        <label for="message">Incoming message</label>
        <textarea
          id="message"
          placeholder="Select a message on the page, or paste it here..."
          maxlength="5000"
        ></textarea>

        <div class="field-footer">
          <button id="readSelection" type="button" class="secondary-button">
            Use selected text
          </button>
          <span id="characterCount">0/5000</span>
        </div>
      </section>

      <section class="rf-template-section">
        <div class="rf-template-heading">
          <div>
            <span>Smart Templates</span>
            <small>Choose the reply intent before generating.</small>
          </div>
          <button
            id="clearTemplateButton"
            type="button"
            class="rf-template-clear"
            hidden
          >
            Clear
          </button>
        </div>

        <div id="templateButtons" class="rf-template-grid">
          <button type="button" class="rf-template-button" data-template="professional">Professional</button>
          <button type="button" class="rf-template-button" data-template="friendly">Friendly</button>
          <button type="button" class="rf-template-button" data-template="apology">Apology</button>
          <button type="button" class="rf-template-button" data-template="approval">Approval</button>
          <button type="button" class="rf-template-button" data-template="reject">Reject</button>
          <button type="button" class="rf-template-button" data-template="clarify">Clarify</button>
          <button type="button" class="rf-template-button" data-template="followup">Follow-up</button>
          <button type="button" class="rf-template-button" data-template="escalate">Escalate</button>
          <button type="button" class="rf-template-button" data-template="thankyou">Thank You</button>
        </div>

        <div id="selectedTemplateStatus" class="rf-template-status" hidden></div>
      </section>

      <section class="settings-grid">
        <label>
          <span>Length</span>
          <select id="length">
            <option>Short</option>
            <option selected>Medium</option>
            <option>Long</option>
          </select>
        </label>

        <label>
          <span>Mode</span>
          <select id="generationMode">
            <option value="multiple" selected>4 Suggestions</option>
            <option value="single">Single Reply</option>
          </select>
        </label>
      </section>

      <button id="generateButton" type="button" class="primary-button">
        Generate Suggestions
      </button>

      <div id="errorBox" class="error-box" hidden></div>

      <section id="singleReplySection" class="reply-section" hidden>
        <div class="reply-heading">
          <span>Generated reply</span>
          <div class="rf-heading-actions">
            <button id="singleAnalyzeButton" type="button">Analyze</button>
            <button id="singleCopyButton" type="button">Copy</button>
          </div>
        </div>

        <textarea
          id="singleReply"
          readonly
          placeholder="Your reply will appear here..."
        ></textarea>

        <div id="singleCoachPanel" class="rf-coach-panel" hidden></div>

        <button
          id="singleInsertButton"
          type="button"
          class="secondary-button full-width"
        >
          Insert into page
        </button>
      </section>

      <section id="multipleRepliesSection" class="multiple-replies-section" hidden>
        <div class="multiple-replies-header">
          <div>
            <span>AI suggestions</span>
            <small>Choose, analyze, improve or rewrite the best reply.</small>
          </div>
          <span id="replyCountBadge">4 replies</span>
        </div>

        <div id="replyCardsContainer"></div>
      </section>

      <footer class="popup-footer">Messaura AI Extension v4.0.0</footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
