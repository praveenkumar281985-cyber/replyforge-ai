<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6d4aff" />
    <title>ReplyForge is offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5fb;color:#161827;font-family:Inter,system-ui,sans-serif;padding:24px}.card{width:min(420px,100%);border:1px solid #e4e3ee;border-radius:24px;background:#fff;padding:32px;box-shadow:0 24px 70px rgba(43,35,85,.12);text-align:center}.mark{display:grid;width:58px;height:58px;margin:0 auto 18px;place-items:center;border-radius:18px;background:linear-gradient(145deg,#7959ff,#5835ea);color:#fff;font-size:25px;font-weight:800}h1{margin:0 0 10px;font-size:25px}p{margin:0 0 22px;color:#667085;line-height:1.6}button{border:0;border-radius:12px;background:#6d4aff;color:#fff;padding:12px 20px;font:inherit;font-weight:750;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">R</div>
      <h1>You’re offline</h1>
      <p>Connect to the internet to generate replies. Your locally saved workspace will still be available when ReplyForge reconnects.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
